# nginx site config for vaulticsage.com
# Uses Cloudflare Origin Certificate (Full Strict mode) — NOT certbot.
#
# The deploy workflow installs this file on every push to main: it copies it to
# /etc/nginx/sites-available/vaultic, makes /etc/nginx/sites-enabled/vaultic a
# symlink to that copy, runs nginx -t and reloads (#155). Before #155 the
# sites-enabled entry was a separate old copy, so edits here never went live.
# On a new server the deploy creates the symlink itself; just remove
# /etc/nginx/sites-enabled/default first.

# Real client IP (#155). Cloudflare sits in front of the origin and sends the
# visitor's address in CF-Connecting-IP. nginx takes that header ONLY when the
# connection comes from a Cloudflare address below, and then sets $remote_addr
# to it. A request that reaches the origin directly from a non-Cloudflare
# address keeps its own peer address, so its CF-Connecting-IP is ignored.
# $remote_addr is what the rate limits key on and what the app receives in
# X-Forwarded-For, so nginx and the app's lockouts count the same client.
# Limit: the header is trusted from ANY Cloudflare peer, not only our zone, so
# a request routed through someone else's Cloudflare zone can still set it.
# Closing that needs the origin to refuse other hostnames or Authenticated
# Origin Pulls (follow-up issue).
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (checked 2026-11-15).
# A range missing here only means those visitors are counted by Cloudflare's
# edge address again.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Rate limiting zones, keyed by the real client IP above. $binary_remote_addr is
# never empty, so a request without CF-Connecting-IP is still limited (#155).
# login: 5 requests/minute for auth endpoints (brute-force protection)
# api:   30 requests/second for general API endpoints
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# Rejected requests get 429 Too Many Requests (nginx default is 503).
limit_req_status 429;

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name vaulticsage.com www.vaulticsage.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vaulticsage.com www.vaulticsage.com;

    # Cloudflare Origin Certificate (created in Cloudflare dashboard:
    # SSL/TLS → Origin Server → Create Certificate → paste into these files)
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Serve the built React app
    root  /home/ubuntu/vaultic/ui/dist;
    index index.html;

    # index.html and service worker must never be cached by the browser or iOS PWA.
    # Vite hashes all JS/CSS filenames on each build, so once iOS fetches a fresh
    # index.html it automatically pulls the new bundles — no reinstall needed.
    location = /index.html {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed JS/CSS/image assets — cache aggressively (filename changes on every build)
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — all non-file routes serve index.html (React Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow up to 25MB uploads (PDF import; nginx default is 1MB)
    client_max_body_size 25m;

    # Auth endpoints — strict rate limit (5 req/min with small burst)
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/auth/verify-2fa {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # General API endpoints — moderate rate limit
    location /api/ {
        # burst=100 leaves room for two dashboard loads (~35 calls each) at once
        limit_req zone=api burst=100 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 180s matches the config that ran in prod before #155 (long PDF imports)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Gzip compression for API responses and static fallbacks
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
